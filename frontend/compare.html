<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Comparison Matrix - AutoElite</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cars.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <style>
    .compare-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 24px;
    }
    .selectors-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      background: var(--bg-surface);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      margin-bottom: 30px;
      box-shadow: var(--shadow-sm);
    }
    @media(max-width: 768px) {
      .selectors-bar { grid-template-columns: 1fr; }
    }
    .selector-box label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .selector-box select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      font-size: 1rem;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media(max-width: 800px) {
      .comparison-grid { grid-template-columns: 1fr; }
    }
    .car-compare-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }
    .car-compare-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }
    .compare-body {
      padding: 24px;
    }
    .compare-table {
      width: 100%;
      margin: 20px 0;
      border-collapse: collapse;
    }
    .compare-table tr {
      border-bottom: 1px solid var(--border-subtle);
    }
    .compare-table td {
      padding: 12px 6px;
      font-size: 0.92rem;
    }
    .compare-table td:first-child {
      color: var(--text-secondary);
      font-weight: 600;
      width: 45%;
    }
    .compare-table td:last-child {
      font-weight: 700;
      color: var(--text-primary);
      text-align: right;
    }
    .highlight-stat {
      color: var(--accent-primary);
      font-weight: 800;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" style="text-decoration:none;color:inherit;"><h2>🚗 AutoElite</h2></a>
    <div class="nav-controls">
      <a href="cars.html"><button>Showroom</button></a>
      <a href="calculator.html"><button>EMI Calculator</button></a>
      <a href="profile.html"><button>My Portal</button></a>
      <button onclick="toggleDarkMode()">🌙</button>
    </div>
  </nav>

  <div class="compare-container">
    <div style="text-align:center;margin-bottom:30px;">
      <h1 class="title">⚔️ Side-by-Side Comparison Matrix</h1>
      <p style="color:var(--text-secondary);font-size:1.05rem;">Analyze horsepower, torque, acceleration, and luxury telemetry head-to-head</p>
    </div>

    <!-- CAR SELECTORS -->
    <div class="selectors-bar">
      <div class="selector-box">
        <label for="selectCar1">Select First Vehicle</label>
        <select id="selectCar1" onchange="updateComparison()"></select>
      </div>
      <div class="selector-box">
        <label for="selectCar2">Select Competitor Vehicle</label>
        <select id="selectCar2" onchange="updateComparison()"></select>
      </div>
    </div>

    <!-- COMPARISON MATRIX -->
    <div class="comparison-grid" id="compareGrid">
      <div id="colCar1" class="car-compare-card"></div>
      <div id="colCar2" class="car-compare-card"></div>
    </div>
  </div>

  <script src="js/toast.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/darkmode.js"></script>
  <script src="js/compare.js"></script>
</body>
</html>
